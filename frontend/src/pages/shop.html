<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP — BARE MONDRIAN</title>
    <meta name="description"
        content="Shop the full BARE MONDRIAN collection. High-end streetwear merging raw energy with disciplined structure.">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css?v=4">
    <link rel="stylesheet" href="../styles/pages/shop.css">
    <link rel="stylesheet" href="../styles/responsive.css?v=1">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar" id="navbar">
        <button class="mobile-hamburger-btn" id="mobile-hamburger-btn" aria-label="Open Navigation Menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <line x1="4" y1="6" x2="20" y2="6" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="18" x2="20" y2="18" />
            </svg>
        </button>

        <a href="index" class="nav-brand">BARE MONDRIAN</a>

        <nav class="nav-links">
            <a href="index" class="nav-link" id="nav-home">HOME</a>
            <a href="javascript:void(0)" class="nav-link active" id="nav-shop">SHOP</a>
            <a href="about" class="nav-link" id="nav-about">ABOUT US</a>
        </nav>

        <div class="nav-icons">
            <button class="icon-btn" id="btn-search" aria-label="Search">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16.5" y1="16.5" x2="21.5" y2="21.5" stroke-linecap="round" />
                </svg>
            </button>

            <button class="icon-btn" id="btn-cart" aria-label="Shopping Bag" onclick="openCart()">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M6 7L4 20H20L18 7H6Z" stroke-linejoin="round" />
                    <path d="M9 10V6C9 4.34315 10.3431 3 12 3C13.6569 3 15 4.34315 15 6V10" />
                </svg>
            </button>

            <button class="icon-btn" id="btn-account" aria-label="Account">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="12" cy="7" r="4" />
                    <path d="M4 21C4 16.5817 7.58172 13 12 13C16.4183 13 20 16.5817 20 21" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-nav-overlay" id="mobile-nav-overlay"></div>
    <div class="mobile-nav-drawer" id="mobile-nav-drawer">
        <div class="mobile-nav-header">
            <span class="mobile-nav-title">MENU</span>
            <button class="mobile-nav-close" id="mobile-nav-close" aria-label="Close Menu">&times;</button>
        </div>
        <nav class="mobile-nav-links">
            <a href="index" class="mobile-nav-link">HOME</a>
            <a href="shop" class="mobile-nav-link active">SHOP</a>
            <a href="about" class="mobile-nav-link">ABOUT US</a>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="shop-main">

        <!-- Page Header Row -->
        <div class="shop-header" id="shop-header">
            <h1 class="shop-title">ALL PRODUCTS</h1>
            <div class="shop-sort">
                <span class="sort-label">SORT BY:</span>
                <div class="sort-dropdown" id="sort-dropdown">
                    <select id="sort-select" aria-label="Sort products">
                        <option value="featured" selected>FEATURED</option>
                        <option value="newest">NEWEST</option>
                        <option value="price-low">PRICE: LOW TO HIGH</option>
                        <option value="price-high">PRICE: HIGH TO LOW</option>
                    </select>
                    <svg class="sort-chevron" viewBox="0 0 24 24" width="16" height="16">
                        <polyline points="6 9 12 15 18 9" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
        </div>

        <hr class="shop-divider">

        <!-- Product Grid — populated dynamically by product.js -->
        <section class="shop-grid" id="shop-grid">
        </section>

        <!-- Load More Section 
        <div class="shop-load-more-section">
            <hr class="shop-divider">
            <button class="shop-load-more" id="load-more-btn">
                <span>LOAD MORE CATALOGUE</span>
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round" />
                    <polyline points="19 12 12 19 5 12" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <hr class="shop-divider">
        </div> 
        -->

    </main>

    <!-- Footer (simplified — no tagline, no social icons) -->
    <footer class="footer footer--simple" id="footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">BARE MONDRIAN</div>
                <p class="footer-copyright">&copy; 2026 BARE MONDRIAN. ALL RIGHTS RESERVED.</p>
            </div>

            <div class="footer-right">
                <nav class="footer-nav footer-nav--row">
                    <a href="#" class="footer-link" id="footer-privacy">PRIVACY POLICY</a>
                    <a href="#" class="footer-link" id="footer-terms">TERMS OF SERVICE</a>
                    <a href="#" class="footer-link" id="footer-contact">CONTACT</a>
                </nav>
            </div>
        </div>
    </footer>

    <!-- Mobile Nav Toggle -->
    <script>
        (function () {
            var hamburgerBtn = document.getElementById('mobile-hamburger-btn');
            var closeBtn = document.getElementById('mobile-nav-close');
            var overlay = document.getElementById('mobile-nav-overlay');
            var drawer = document.getElementById('mobile-nav-drawer');

            function openMobileNav() {
                if (overlay && drawer) {
                    overlay.classList.add('active');
                    drawer.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }

            function closeMobileNav() {
                if (overlay && drawer) {
                    overlay.classList.remove('active');
                    drawer.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            if (hamburgerBtn) hamburgerBtn.addEventListener('click', openMobileNav);
            if (closeBtn) closeBtn.addEventListener('click', closeMobileNav);
            if (overlay) overlay.addEventListener('click', closeMobileNav);
        })();
    </script>

    <!-- Shop Interactivity -->
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/product.js"></script>
    <script src="../scripts/cart.js?v=5"></script>

</body>

</html>
