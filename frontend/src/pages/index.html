<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARE MONDRIAN — High-End Streetwear</title>
    <meta name="description"
        content="High-end streetwear merging raw energy with disciplined structure. Discover the collection at BARE MONDRIAN.">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css?v=4">
    <link rel="stylesheet" href="../styles/pages/home.css">
</head>

<body class="home-page">

    <!-- Navbar -->
    <header class="navbar" id="navbar">
        <div class="nav-brand">BARE MONDRIAN</div>

        <nav class="nav-links">
            <a href="/pages/index.html" class="nav-link active" id="nav-home">HOME</a>
            <a href="/pages/shop.html" class="nav-link" id="nav-shop">SHOP</a>
            <a href="/pages/about.html" class="nav-link" id="nav-about">ABOUT US</a>
        </nav>

        <div class="nav-icons">
            <button class="icon-btn" id="btn-search" aria-label="Search">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="11" cy="11" r="7" />
                    <line x1="16.5" y1="16.5" x2="21.5" y2="21.5" stroke-linecap="round" />
                </svg>
            </button>

            <button class="icon-btn" id="btn-cart" aria-label="Shopping Bag" onclick="openCart()">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M6 7L4 20H20L18 7H6Z" stroke-linejoin="round" />
                    <path d="M9 10V6C9 4.34315 10.3431 3 12 3C13.6569 3 15 4.34315 15 6V10" />
                </svg>
            </button>

            <button class="icon-btn" id="btn-account" aria-label="Account">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="12" cy="7" r="4" />
                    <path d="M4 21C4 16.5817 7.58172 13 12 13C16.4183 13 20 16.5817 20 21" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section" id="hero">
        <div class="hero-container">
            <div class="hero-image-wrapper">
                <img src="hero_model.png" alt="BARE Mondrian Avant-Garde Structured Outfit" class="hero-image">
                <div class="hero-wordmark">BARE Mondrian</div>
            </div>
        </div>
    </section>

    <!-- Product Grid Section -->
    <section class="products-section" id="products">
        <div class="products-grid">
            <a href="shop.html" class="product-card" id="product-card-1" aria-label="Collection 1">
                <img src="collection_1.png" alt="Foto Produk 1" class="product-card-image">
                <div class="product-card-overlay">
                    <span class="product-card-cta">VIEW COLLECTION</span>
                </div>
            </a>
            <a href="shop.html" class="product-card" id="product-card-2" aria-label="Collection 2">
                <img src="collection_2.png" alt="Foto Produk 2" class="product-card-image">
                <div class="product-card-overlay">
                    <span class="product-card-cta">VIEW COLLECTION</span>
                </div>
            </a>
            <a href="shop.html" class="product-card" id="product-card-3" aria-label="Collection 3">
                <img src="collection_3.png" alt="Foto Produk 3" class="product-card-image">
                <div class="product-card-overlay">
                    <span class="product-card-cta">VIEW COLLECTION</span>
                </div>
            </a>
        </div>
    </section>

    <footer class="footer footer--simple" id="footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">BARE MONDRIAN</div>
                <p class="footer-copyright">&copy; 2026 BARE MONDRIAN. ALL RIGHTS RESERVED.</p>
            </div>

            <div class="footer-right">
                <nav class="footer-nav footer-nav--row">
                    <a href="#" class="footer-link" id="footer-privacy">PRIVACY POLICY</a>
                    <a href="#" class="footer-link" id="footer-terms">TERMS OF SERVICE</a>
                    <a href="#" class="footer-link" id="footer-contact">CONTACT</a>
                </nav>
            </div>
        </div>
    </footer>

    <!-- Header Scroll Interactivity -->
    <script>
        (function () {
            var navbar = document.getElementById('navbar');
            function handleScroll() {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            }
            window.addEventListener('scroll', handleScroll);
            handleScroll();
        })();
    </script>
    <script src="../scripts/cart.js?v=5"></script>

</body>

</html>
