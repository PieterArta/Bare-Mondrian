<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Approval — BARE MONDRIAN Admin</title>
    <meta name="description" content="BARE MONDRIAN Admin — review and approve customer payment submissions.">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/pages/admin.css">
</head>

<body class="admin-page">

    <div class="admin-layout">

        <!-- Sidebar overlay (mobile drawer) -->
        <div class="admin-sidebar-overlay" id="admin-sidebar-overlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-top">
                <a href="dashboard.html" class="sidebar-brand" id="sidebar-brand">
                    <span class="sidebar-brand-main">BARE</span>
                    <span class="sidebar-brand-sub">MONDRIAN</span>
                </a>

                <nav class="sidebar-nav" id="sidebar-nav">
                    <a href="dashboard.html" class="sidebar-nav-item" id="nav-dashboard">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                        </svg>
                        DASHBOARD
                    </a>
                    <a href="orders.html" class="sidebar-nav-item active" id="nav-orders">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                            <line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                        ORDERS
                    </a>
                    <a href="products.html" class="sidebar-nav-item" id="nav-products">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                            <line x1="7" y1="7" x2="7.01" y2="7"/>
                        </svg>
                        PRODUCTS
                    </a>
                    <a href="homepage-settings.html" class="sidebar-nav-item" id="nav-homepage">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        HOMEPAGE
                    </a>
                </nav>
            </div>

            <div class="sidebar-bottom">
                <a href="login.html" class="sidebar-logout" id="btn-logout">
                    <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    LOGOUT
                </a>
            </div>
        </aside>

        <!-- ===== MAIN ===== -->
        <div class="admin-main">

            <!-- TOP BAR — with search input variant -->
            <header class="admin-topbar admin-topbar--search" id="admin-topbar">
                <button class="admin-hamburger-btn" id="admin-hamburger-btn" aria-label="Open Navigation Menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="6" x2="20" y2="6" />
                        <line x1="4" y1="12" x2="20" y2="12" />
                        <line x1="4" y1="18" x2="20" y2="18" />
                    </svg>
                </button>
                <a href="dashboard.html" class="topbar-brand" id="topbar-brand">BARE MONDRIAN<span class="topbar-brand-admin-text"> ADMIN</span></a>

                <div class="topbar-search-group" id="topbar-search-group">
                    <!-- Search input -->
                    <div class="topbar-search-box" id="topbar-search-box">
                        <svg class="topbar-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"/>
                            <line x1="16.5" y1="16.5" x2="21.5" y2="21.5"/>
                        </svg>
                        <input
                            type="text"
                            id="orders-search-input"
                            class="topbar-search-input"
                            placeholder="SEARCH..."
                            autocomplete="off"
                            aria-label="Search orders by customer or order ID"
                        >
                    </div>

                    <!-- Bell -->
                    <button class="topbar-icon-btn" id="btn-topbar-notifications" aria-label="Notifications">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>

                    <!-- Account -->
                    <button class="topbar-icon-btn" id="btn-topbar-account" aria-label="Account">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- PAGE CONTENT -->
            <main class="admin-content" id="orders-content">

                <!-- Page Title -->
                <div class="orders-page-header" id="orders-page-header">
                    <h1 class="orders-page-title" id="orders-page-title">PAYMENT APPROVAL</h1>
                </div>

                <!-- Filter Tabs -->
                <div class="orders-filter-section" id="orders-filter-section">
                    <div class="filter-tabs" id="filter-tabs" role="tablist">
                        <button class="filter-tab" id="tab-all" data-filter="all" role="tab" aria-selected="false">ALL</button>
                        <button class="filter-tab filter-tab--active" id="tab-pending" data-filter="pending" role="tab" aria-selected="true">PENDING</button>
                        <button class="filter-tab" id="tab-approved" data-filter="approved" role="tab" aria-selected="false">APPROVED</button>
                        <button class="filter-tab" id="tab-rejected" data-filter="rejected" role="tab" aria-selected="false">REJECTED</button>
                    </div>
                    <hr class="filter-divider">
                </div>

                <!-- Orders Table -->
                <div class="orders-table-wrapper" id="orders-table-wrapper">
                    <table class="orders-table" id="orders-table">
                        <thead>
                            <tr class="orders-thead-row">
                                <th class="orders-th" id="th-order-id">ORDER ID</th>
                                <th class="orders-th" id="th-customer">CUSTOMER</th>
                                <th class="orders-th" id="th-product">PRODUCT</th>
                                <th class="orders-th" id="th-total">TOTAL</th>
                                <th class="orders-th" id="th-proof">PROOF</th>
                                <th class="orders-th" id="th-status">STATUS</th>
                                <th class="orders-th" id="th-date">DATE</th>
                                <th class="orders-th orders-th--right" id="th-actions">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>

                    <!-- Empty state -->
                    <div class="orders-empty-state" id="orders-empty-state" style="display:none;">
                        <span class="orders-empty-text">No orders match this filter.</span>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- ===== PROOF LIGHTBOX MODAL ===== -->
    <div class="proof-modal" id="proof-modal" role="dialog" aria-modal="true" aria-label="Payment proof preview" style="display:none;">
        <div class="proof-modal-backdrop" id="proof-modal-backdrop"></div>
        <div class="proof-modal-box" id="proof-modal-box">
            <button class="proof-modal-close" id="proof-modal-close" aria-label="Close preview">&times;</button>
            <img src="" alt="Payment proof" class="proof-modal-img" id="proof-modal-img"
                 onerror="this.style.display='none'; document.getElementById('proof-modal-placeholder').style.display='flex';">
            <div class="proof-modal-placeholder" id="proof-modal-placeholder" style="display:none;">
                <span>No image available</span>
            </div>
        </div>
    </div>

    <script src="../scripts/auth.js"></script>
<script src="../scripts/admin/order-approval.js"></script>

</body>

</html>
