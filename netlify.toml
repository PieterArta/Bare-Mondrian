# netlify.toml — BARE MONDRIAN
# Publish dir is `frontend/src`

[build]
  base = ""
  publish = "frontend/src"

# ─── 301 Force Redirects (evaluated first) ──────────────────────────────────
# Redirect old /pages/*.html and /admin/*.html paths to clean URLs

[[redirects]]
  from = "/pages/index.html"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pages/index"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pages/"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pages/shop.html"
  to   = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/pages/shop"
  to   = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/pages/about.html"
