  status = 301
  force = true

[[redirects]]
  from = "/pages/product-detail"
  to   = "/product-detail"
  status = 301
  force = true

[[redirects]]
  from = "/pages/login.html"
  to   = "/login"
  status = 301
  force = true

[[redirects]]
