  status = 301
  force = true

[[redirects]]
  from = "/pages/about"
  to   = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/pages/cart.html"
  to   = "/cart"
  status = 301
  force = true

[[redirects]]
  from = "/pages/cart"
  to   = "/cart"
  status = 301
  force = true

[[redirects]]
