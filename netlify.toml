# netlify.toml — BARE MONDRIAN
# Publish dir is `frontend/src`

[build]
  base = ""
  publish = "frontend/src"

# ─── Pretty/clean URL redirects ─────────────────────────────────────────────
# Maps clean URLs (both root level and /pages/* or /admin/*) to their .html files.

# Root clean URLs
[[redirects]]
  from = "/"
  to   = "/pages/index.html"
  status = 200

[[redirects]]
  from = "/index"
  to   = "/pages/index.html"
  status = 200

[[redirects]]
  from = "/shop"
  to   = "/pages/shop.html"
  status = 200

[[redirects]]
  from = "/about"
  to   = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/cart"
  to   = "/pages/cart.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to   = "/pages/checkout.html"
  status = 200

[[redirects]]
  from = "/payment"
  to   = "/pages/payment.html"
  status = 200

[[redirects]]
  from = "/product-detail"
  to   = "/pages/product-detail.html"
  status = 200

[[redirects]]
  from = "/login"
  to   = "/pages/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to   = "/pages/register.html"
  status = 200

[[redirects]]
  from = "/order-confirmation"
  to   = "/pages/order-confirmation.html"
  status = 200

