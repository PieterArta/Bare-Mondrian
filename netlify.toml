# netlify.toml — BARE MONDRIAN
# Publish dir is `frontend/src`

[build]
  base = ""
  publish = "frontend/src"

# ─── 301 Legacy Path Redirects ──────────────────────────────────────────────
# Redirect legacy /pages/* (without .html) and /index to clean root paths.

[[redirects]]
  from = "/index"
  to   = "/"
  status = 301

[[redirects]]
  from = "/pages/"
  to   = "/"
  status = 301

[[redirects]]
  from = "/pages/index"
  to   = "/"
  status = 301

[[redirects]]
  from = "/pages/shop"
  to   = "/shop"
  status = 301

[[redirects]]
  from = "/pages/about"
  to   = "/about"
  status = 301

[[redirects]]
  from = "/pages/cart"
  to   = "/cart"
  status = 301

[[redirects]]
  from = "/pages/checkout"
  to   = "/checkout"
  status = 301

[[redirects]]
  from = "/pages/payment"
  to   = "/payment"
  status = 301

[[redirects]]
  from = "/pages/product-detail"
  to   = "/product-detail"
  status = 301

[[redirects]]
  from = "/pages/login"
  to   = "/login"
  status = 301

[[redirects]]
  from = "/pages/register"
  to   = "/register"
  status = 301

[[redirects]]
  from = "/pages/order-confirmation"
  to   = "/order-confirmation"
  status = 301

# ─── 200 Rewrites (Clean URLs -> Physical HTML Files) ───────────────────────

# Root clean URLs
[[redirects]]
  from = "/"
  to   = "/pages/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop"
  to   = "/pages/shop.html"
  status = 200

[[redirects]]
  from = "/about"
  to   = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/cart"
  to   = "/pages/cart.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to   = "/pages/checkout.html"
  status = 200

[[redirects]]
  from = "/payment"
  to   = "/pages/payment.html"
  status = 200

[[redirects]]
  from = "/product-detail"
  to   = "/pages/product-detail.html"
  status = 200

[[redirects]]
  from = "/login"
  to   = "/pages/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to   = "/pages/register.html"
  status = 200

[[redirects]]
  from = "/order-confirmation"
  to   = "/pages/order-confirmation.html"
  status = 200

# Admin routes
[[redirects]]
  from = "/admin"
  to   = "/admin/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/dashboard"
  to   = "/admin/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/orders"
  to   = "/admin/orders.html"
  status = 200

[[redirects]]
  from = "/admin/products"
  to   = "/admin/products.html"
  status = 200

[[redirects]]
  from = "/admin/add-product"
  to   = "/admin/add-product.html"
  status = 200

[[redirects]]
  from = "/admin/edit-product"
  to   = "/admin/edit-product.html"
  status = 200

[[redirects]]
  from = "/admin/homepage-settings"
  to   = "/admin/homepage-settings.html"
  status = 200

[[redirects]]
  from = "/admin/about-settings"
  to   = "/admin/about-settings.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to   = "/admin/login.html"
  status = 200

