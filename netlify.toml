  to   = "/admin/login"
  status = 301
  force = true

# ─── 200 Rewrites (Clean URLs -> Physical HTML Files) ───────────────────────

# Root clean URLs
[[redirects]]
  from = "/"
  to   = "/pages/index.html"
  status = 200

