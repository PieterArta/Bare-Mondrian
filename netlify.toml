# Admin 301 Force Redirects
[[redirects]]
  from = "/admin/dashboard.html"
  to   = "/admin/dashboard"
  status = 301
  force = true

[[redirects]]
  from = "/admin/orders.html"
  to   = "/admin/orders"
  status = 301
  force = true

[[redirects]]
  from = "/admin/products.html"
  to   = "/admin/products"
  status = 301
  force = true

[[redirects]]
  from = "/admin/add-product.html"
  to   = "/admin/add-product"
  status = 301
  force = true

[[redirects]]
  from = "/admin/edit-product.html"
  to   = "/admin/edit-product"
  status = 301
